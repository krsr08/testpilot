name: testpilot
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: testpilot
      POSTGRES_PASSWORD: testpilot_local
      POSTGRES_DB: testpilot
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testpilot"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  redis_data:
