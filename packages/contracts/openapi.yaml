          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "title": {
                    "type": "string"
                  },
                  "type": {
                    "enum": [
                      "positive",
                      "negative",
                      "boundary",
                      "permission",
                      "other"
                    ]
                  },
                  "priority": {
                    "enum": [
                      "low",
                      "medium",
                      "high"
                    ]
                  },
                  "preconditions": {
                    "type": "string"
                  },
                  "testData": {
                    "type": "string"
                  },
                  "postconditions": {
                    "type": "string"
                  },
                  "rationale": {
                    "type": "string"
                  },
                  "steps": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "action": {
                          "type": "string",
                          "maxLength": 2000
                        },
                        "expectedResult": {
                          "type": "string",
                          "maxLength": 2000
                        }
                      },
                      "required": [
                        "action",
                        "expectedResult"
                      ],
                      "additionalProperties": false
                    },
                    "maxItems": 30
                  },
                  "version": {
                    "type": "integer",
