                  },
                  "steps": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "action": {
                          "type": "string",
                          "maxLength": 2000
                        },
                        "expectedResult": {
                          "type": "string",
                          "maxLength": 2000
                        }
                      },
                      "required": [
                        "action",
                        "expectedResult"
                      ],
                      "additionalProperties": false
                    },
                    "maxItems": 30
                  },
                  "requirementIds": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "format": "uuid"
                    }
                  },
                  "reviewerNotes": {
                    "type": "string",
                    "maxLength": 5000
                  }
                },
                "required": [
                  "title",
                  "steps"
                ],
                "additionalProperties": false
              }
            }
          }
        },
        "description": "Incomplete draft steps are allowed; approval validates nonblank actions and expected results."
      }
