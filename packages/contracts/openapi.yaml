  "components": {
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "code",
          "message",
          "field_errors",
          "request_id"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "field_errors": {},
          "request_id": {
            "type": "string",
            "format": "uuid"
          }
        }
      },
      "ProjectInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "description": {
            "type": "string",
            "maxLength": 2000
          },
          "domain": {
            "type": "string",
            "maxLength": 120
          }
        }
      },
      "RequirementEdit": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "version"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "text": {
            "type": "string",
            "minLength": 1,
            "maxLength": 10000
          },
          "included": {
            "type": "boolean"
          },
          "outOfScopeReason": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 2000
          }
        }
      },
      "GenerationInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "snapshot_hash",
          "idempotency_key"
        ],
        "properties": {
          "snapshot_hash": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "idempotency_key": {
            "type": "string",
            "minLength": 8,
            "maxLength": 120
          },
          "types": {
            "type": "array",
            "minItems": 1,
            "maxItems": 5,
            "items": {
              "enum": [
                "positive",
                "negative",
                "boundary",
                "permission",
                "other"
              ]
            }
          }
        }
      },
      "Job": {
        "type": "object",
        "required": [
          "id",
          "status",
          "stage",
          "progress"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "enum": [
              "queued",
              "running",
              "succeeded",
              "failed"
            ]
          },
          "stage": {
            "type": "string"
          },
          "progress": {
            "type": "integer"
          },
          "error": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      }
    }
  }
}
