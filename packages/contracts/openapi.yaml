        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "title": {
                    "type": "string"
                  },
                  "type": {
                    "enum": [
                      "positive",
                      "negative",
                      "boundary",
                      "permission",
                      "other"
                    ]
                  },
                  "priority": {
                    "enum": [
                      "low",
                      "medium",
                      "high"
