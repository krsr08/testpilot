    "/projects/{id}/sources": {
      "post": {
        "summary": "Upload one original or paste a story; queue extraction",
        "responses": {
          "202": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "source": {
                      "type": "object"
