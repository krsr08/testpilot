{
  "openapi": "3.1.0",
  "info": {
    "title": "TestPilot AI API",
    "version": "2.1.0",
    "description": "TestPilot AI enterprise API. Production authentication uses OIDC bearer tokens; every project request enforces organization-backed workspace membership and role authorization."
