              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "projects": {
                      "type": "array",
                      "items": {
                        "type": "object"
                      },
                      "minItems": 0,
                      "maxItems": 100
                    },
                    "next_cursor": {
                      "type": [
                        "string",
                        "null"
                      ]
                    }
                  },
                  "required": [],
                  "additionalProperties": false
                }
              }
            }
          },
          "default": {
            "description": "Structured error: 401 authentication, 403 origin/access, 404 resource, 409 concurrency/state, 422 validation, 429 generation rate limit, 500 internal",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "search",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100
            }
          },
          {
            "in": "query",
            "schema": {
              "enum": [
                "APPLICATION",
                "API",
                "MOBILE",
                "DATA",
                "INTEGRATION",
                "MIGRATION",
                "OTHER"
              ],
              "type": "string"
            },
            "name": "type"
          },
          {
            "in": "query",
            "schema": {
              "enum": [
                "all",
                "in-progress",
                "review-ready"
              ],
              "type": "string"
            },
            "name": "status"
          },
          {
            "in": "query",
            "schema": {
              "enum": [
                "updated-desc",
                "updated-asc",
                "name-asc",
                "name-desc"
              ],
              "type": "string"
            },
            "name": "sort"
          }
        ]
      },
      "post": {
        "summary": "Create project",
        "responses": {
          "201": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          },
          "default": {
            "description": "Structured error: 401 authentication, 403 origin/access, 404 resource, 409 concurrency/state, 422 validation, 429 generation rate limit, 500 internal",
